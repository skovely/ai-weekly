<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 市场洞察周刊 — 2026-05-15 ~ 2026-05-21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d;
  --bg-card: #161616;
  --bg-section: #1a1a1a;
  --text-primary: #f0ede6;
  --text-secondary: #9c9994;
  --text-muted: #5a5855;
  --accent: #c8a96e;
  --accent-dim: rgba(200,169,110,0.15);
  --border: rgba(240,237,230,0.08);
  --signal-strong: #e05c5c;
  --signal-mid: #d4a843;
  --signal-weak: #5a5855;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; max-width: 100%; }
html { scroll-behavior: smooth; overflow-x: clip; }
body {
  background: var(--bg);
  color: var(--text-primary);
  position: relative;
  font-family: var(--font-body);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
header {
  padding: 80px 40px 40px;
  max-width: 960px;
  margin: 0 auto;
  text-align: center;
}
header h1 {
  font-family: var(--font-display);
  font-size: 2.6rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  margin-bottom: 8px;
}
header .period {
  font-size: 0.95rem;
  color: var(--text-secondary);
  margin-bottom: 24px;
}
header .source-badges {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}
.source-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.source-badge.active {
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  color: var(--accent);
}
.source-badge.inactive {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
}
nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 32px;
  border-bottom: 1px solid var(--border);
  background: rgba(13,13,13,0.95);
  position: -webkit-sticky;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  max-width: none;
  width: 100%;
  left: 0;
  right: 0;
}
nav ul {
  list-style: none;
  display: flex;
  justify-content: center;
  gap: 28px;
  max-width: 960px;
  margin: 0 auto;
  overflow-x: auto;
}
nav li { white-space: nowrap; }
nav a {
  display: block;
  padding: 16px 0;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  transition: color 0.2s;
  border-bottom: 2px solid transparent;
}
nav a:hover, nav a.active { color: var(--accent); border-bottom-color: var(--accent); }
main { max-width: 960px; margin: 0 auto; padding: 0 40px 60px; }
section {
  padding: 48px 0;
  animation: fadeUp 0.6s ease both;
}
section:nth-child(1) { animation-delay: 0s; }
section:nth-child(2) { animation-delay: 0.1s; }
section:nth-child(3) { animation-delay: 0.2s; }
section:nth-child(4) { animation-delay: 0.3s; }
section:nth-child(5) { animation-delay: 0.4s; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}
.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.section-header .num {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--accent);
  opacity: 0.6;
}
.section-header h2 {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-primary);
}
.shift-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  margin-bottom: 20px;
}
.shift-card .domain {
  font-size: 0.75rem;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.shift-card .shift-direction {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 12px 0;
  font-size: 0.95rem;
}
.shift-card .shift-direction .arrow {
  color: var(--accent);
  font-size: 1.2rem;
}
.shift-card .shift-direction .from, .shift-card .shift-direction .to {
  padding: 4px 10px;
  background: var(--bg-section);
  border-radius: 4px;
}
.shift-card .meta {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 12px;
  font-size: 0.8rem;
}
.shift-card .fb-insight {
  margin-top: 14px;
  padding: 10px 14px;
  background: rgba(100, 200, 255, 0.07);
  border-left: 3px solid #64c8ff;
  border-radius: 0 6px 6px 0;
  font-size: 0.82rem;
  color: var(--text-secondary);
}
.shift-card .fb-insight strong { color: var(--accent); }
.matrix {
  display: grid;
  grid-template-columns: 140px 1fr 1fr;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  width: 100%;
}
.matrix .cell {
  padding: 16px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  min-height: 80px;
}
.matrix .cell:last-child { border-right: none; }
.matrix .header-cell {
  background: var(--bg-card);
  font-weight: 600;
  font-size: 0.82rem;
  color: var(--text-secondary);
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
}
.matrix .row-label {
  background: var(--bg-card);
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  padding-left: 20px;
}
.matrix .cell.empty {
  background: rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 0.8rem;
}
.matrix .cell .signal-title {
  font-weight: 500;
  font-size: 0.9rem;
  margin-bottom: 6px;
}
.matrix .cell .signal-note {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.matrix .cell .fb-evidence {
  font-size: 0.72rem;
  color: #64c8ff;
  margin-top: 6px;
  padding: 4px 8px;
  background: rgba(100,200,255,0.06);
  border-radius: 4px;
}
.opportunity-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px 20px 20px 24px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}
.opportunity-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 60px;
  transition: height 0.3s ease;
}
.opportunity-card:hover::before { height: 100%; }
.opportunity-card.strong::before { background: var(--signal-strong); }
.opportunity-card.mid::before { background: var(--signal-mid); }
.opportunity-card.weak::before { background: var(--signal-weak); }
.opportunity-card h3 {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 8px;
}
.opportunity-card .evidence, .opportunity-card .supply {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.opportunity-card .evidence strong, .opportunity-card .supply strong {
  color: var(--text-primary);
}
.opportunity-card .cross-source {
  margin-top: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 0.82rem;
}
.opportunity-card .cross-source.ph {
  background: rgba(220, 86, 37, 0.1);
  border-left: 3px solid #dc5625;
}
.opportunity-card .cross-source.watcha {
  background: rgba(100, 200, 255, 0.1);
  border-left: 3px solid #64c8ff;
}
.opportunity-card .cross-source.fb {
  background: rgba(120, 80, 200, 0.1);
  border-left: 3px solid #7850c8;
}
.source-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.source-group .source-badge {
  font-size: 0.65rem;
  padding: 2px 8px;
}
.source-group .source-badge.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.source-group .source-badge.inactive { background: transparent; border-color: var(--border); color: var(--text-muted); }
.signal-tag {
  font-size: 0.7rem;
  font-weight: 600;
  margin-left: 4px;
}
.signal-tag.strong { color: var(--signal-strong); }
.signal-tag.mid { color: var(--signal-mid); }
.signal-tag.weak { color: var(--signal-weak); }
.catalyst-item {
  background: var(--bg-card);
  border-left: 3px solid var(--accent);
  padding: 16px 20px;
  margin-bottom: 14px;
  border-radius: 0 8px 8px 0;
}
.catalyst-item .event-title {
  font-weight: 600;
  margin-bottom: 6px;
}
.catalyst-item .detail {
  font-size: 0.85rem;
  color: var(--text-secondary);
}
.noise-box {
  margin-top: 32px;
  padding: 20px;
  background: var(--bg-section);
  border-radius: 8px;
  border: 1px dashed var(--border);
}
.noise-box h4 {
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.noise-box p {
  font-size: 0.85rem;
  color: var(--text-secondary);
}
.watch-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 14px;
}
.watch-item .number {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--accent);
  opacity: 0.5;
  margin-right: 8px;
}
.watch-item h3 { display: inline; font-family: var(--font-display); font-size: 1rem; }
.watch-item .trigger, .watch-item .implication {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-top: 6px;
}
.watch-item .trigger strong, .watch-item .implication strong { color: var(--text-primary); }
.watch-item .fb-hint {
  margin-top: 8px;
  padding: 6px 10px;
  background: rgba(100,200,255,0.06);
  border-radius: 4px;
  font-size: 0.78rem;
  color: #64c8ff;
}
aside {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 40px 60px;
}
aside details {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
}
aside details summary {
  padding: 16px 20px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--accent);
  user-select: none;
}
aside details summary::-webkit-details-marker { color: var(--accent); }
aside details .table-wrap {
  max-height: 400px;
  overflow-y: auto;
  border-top: 1px solid var(--border);
}
aside table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 0.78rem;
}
aside thead { position: sticky; top: 0; z-index: 1; }
aside th {
  background: var(--bg-section);
  color: var(--text-secondary);
  text-align: left;
  padding: 10px 12px;
  font-weight: 500;
}
aside td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
}
aside tr:nth-child(even) td { background: var(--bg-section); }
footer {
  max-width: 960px;
  margin: 0 auto;
  padding: 40px;
  text-align: center;
  border-top: 1px solid var(--border);
}
footer p {
  font-size: 0.78rem;
  color: var(--text-muted);
}
footer a { color: var(--accent); text-decoration: none; }
.history-panel {
  position: fixed;
  top: 0;
  right: -340px;
  width: 320px;
  height: 100vh;
  background: var(--bg-card);
  border-left: 1px solid var(--border);
  z-index: 200;
  padding: 24px;
  overflow-y: auto;
  transition: right 0.3s ease;
}
.history-panel.open { right: 0; }
.history-panel h3 {
  font-family: var(--font-display);
  font-size: 1.1rem;
  margin-bottom: 16px;
  color: var(--accent);
}
.history-panel .close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 1.2rem;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
}
.history-panel .close-btn:hover { border-color: var(--accent); color: var(--accent); }
.history-item {
  display: block;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 8px;
  text-decoration: none;
  color: var(--text-primary);
  transition: 0.2s;
  font-size: 0.85rem;
}
.history-item:hover { border-color: var(--accent); background: var(--accent-dim); }
.history-item .history-date {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--accent);
  margin-bottom: 2px;
}
.history-item .history-status { font-size: 0.72rem; color: var(--text-muted); }
.history-item.current { border-color: var(--accent); }
.history-toggle {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 150;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.78rem;
  transition: 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.history-toggle:hover { border-color: var(--accent); color: var(--accent); }
.history-toggle .icon { font-size: 1rem; }
@media (max-width: 700px) {
  header { padding: 60px 20px 30px; }
